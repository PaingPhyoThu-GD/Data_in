[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-ocr"
version = "0.1.0"
description = "Modular Myanmar-English OCR Backend using Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.34.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12.0",
    "openpyxl>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

